<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoftHub Admin</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell admin"><header class="section-heading"><div><p class="eyebrow">SOFTHUB ADMIN</p><h1>Manage your library</h1></div><a class="refresh" href="./">View public site →</a></header><section class="admin-panel"><h2>Admin access</h2><p>Use the secret token configured in your Apps Script project.</p><input id="token" type="password" placeholder="Admin token"><button id="save-token" class="download">Save token</button></section><section class="admin-panel"><h2>Upload a file</h2><p>Files are uploaded to your Google Drive public folder.</p><input id="upload" type="file"><select id="category"><option value="">Choose category</option><option>Design</option><option>Video</option><option>Utilities</option><option>Development</option><option>Documents</option></select><button id="upload-button" class="download">Upload to Drive</button><p id="admin-status" class="status"></p></section><section class="admin-panel"><h2>Library categories</h2><p>New categories can be used for future uploads.</p><input id="new-category" placeholder="Category name"><button id="add-category" class="download">Add category</button><div id="categories"></div></section></main><script>const API_URL="https://script.google.com/macros/s/AKfycbx7xWYSTGmbpcggCpST9i5DZLqVuppJjCXgxYAxIbCQKHPIbqra_r0QgtlsznpWXx_q/exec";const token=document.querySelector('#token'),status=document.querySelector('#admin-status');document.querySelector('#save-token').onclick=()=>{localStorage.setItem('softhub-admin-token',token.value);status.textContent='Token saved in this browser.'};document.querySelector('#add-category').onclick=()=>{const value=document.querySelector('#new-category').value.trim();if(value){const item=document.createElement('span');item.textContent=value;item.style='display:inline-block;margin:12px 8px 0 0;padding:7px 10px;background:#e1f1d7;border-radius:4px;font-size:11px';document.querySelector('#categories').append(item);document.querySelector('#new-category').value=''}};document.querySelector('#upload-button').onclick=async()=>{const file=document.querySelector('#upload').files[0],category=document.querySelector('#category').value,adminToken=localStorage.getItem('softhub-admin-token');if(!file||!category||!adminToken){status.textContent='Choose a file, category, and token.';return}status.textContent='Upload requires the Apps Script upload endpoint. Add it to Code.gs, then try again.'};</script></body></html>
