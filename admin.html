<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoftHub Admin</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell admin"><header class="section-heading"><div><p class="eyebrow">SOFTHUB ADMIN</p><h1>Manage your library</h1></div><a class="refresh" href="./">View public site →</a></header><section class="admin-panel"><h2>Admin access</h2><p>Enter the token from your Apps Script project.</p><input id="token" type="password" placeholder="Admin token"><button id="save-token" class="download" type="button">Save token</button></section><section class="admin-panel"><h2>Upload a file</h2><p>Files are uploaded to your Google Drive public folder.</p><input id="upload" type="file"><select id="category"><option value="">Choose category</option><option>Design</option><option>Video</option><option>Utilities</option><option>Development</option><option>Documents</option></select><button id="upload-button" class="download" type="button">Upload to Drive</button><p id="admin-status" class="status"></p></section><section class="admin-panel"><h2>Library categories</h2><p>Categories are saved in this browser for quick reuse.</p><input id="new-category" placeholder="Category name"><button id="add-category" class="download" type="button">Add category</button><div id="categories"></div></section></main><script>
const API_URL="https://script.google.com/macros/s/AKfycbx7xWYSTGmbpcggCpST9i5DZLqVuppJjCXgxYAxIbCQKHPIbqra_r0QgtlsznpWXx_q/exec";const token=document.querySelector('#token'),status=document.querySelector('#admin-status');token.value=localStorage.getItem('softhub-admin-token')||'';document.querySelector('#save-token').onclick=()=>{if(!token.value.trim()){status.textContent='Enter a token first.';return}localStorage.setItem('softhub-admin-token',token.value.trim());status.textContent='Token saved in this browser.'};document.querySelector('#add-category').onclick=()=>{const value=document.querySelector('#new-category').value.trim();if(!value)return;const option=document.createElement('option');option.value=value;option.textContent=value;document.querySelector('#category').append(option);document.querySelector('#new-category').value='';status.textContent=`Category “${value}” added.`};document.querySelector('#upload-button').onclick=async()=>{const file=document.querySelector('#upload').files[0],category=document.querySelector('#category').value,adminToken=localStorage.getItem('softhub-admin-token');if(!file||!category||!adminToken){status.textContent='Choose a file, category, and token.';return}status.textContent='Uploading…';const reader=new FileReader();reader.onload=async()=>{try{const base64=reader.result.split(',')[1];const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'upload',token:adminToken,name:file.name,mimeType:file.type,data:base64,category})});const result=await response.json();if(!response.ok||result.error)throw new Error(result.error||`HTTP ${response.status}`);status.textContent='Uploaded successfully. Refresh the public page to see it.';document.querySelector('#upload').value=''}catch(error){status.textContent=`Upload failed: ${error.message}`}};reader.onerror=()=>{status.textContent='Could not read that file.'};reader.readAsDataURL(file)};
</script></body></html>
